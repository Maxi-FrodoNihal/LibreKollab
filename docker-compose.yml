services:
  minio:
    image: minio/minio
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  libreoffice:
    build:
      context: .
      dockerfile: docker/libreoffice/Dockerfile
    networks:
      - internal
    volumes:
      - workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "cat /dev/null > /dev/tcp/localhost/2002"]
      interval: 10s
      timeout: 5s
      retries: 10

  liberekollab:
    build: .
    ports:
      - "8080:8080"
    networks:
      - internal
    environment:
      LIBREOFFICE_HOST: libreoffice
      LIBREOFFICE_PORT: 2002
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      WORKSPACE_PATH: /workspace
    volumes:
      - workspace:/workspace
    depends_on:
      libreoffice:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/kollab/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  minio-data:
  workspace:
